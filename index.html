<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Shonaa ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="musicBtn">▶️ Play Music</button>
<audio id="music" src="music.mp3" loop></audio>

<div class="container">
  <img src="dudu.gif" class="bear">

  <h1 id="question"></h1>

  <!-- Buttons -->
  <div id="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😳</button>
  </div>

  <!-- Slider -->
  <div id="sliderBox" class="hidden">
    <input type="range" min="0" max="100" value="10" id="slider">
    <p id="sliderText">Only this much? (10%)</p>
  </div>

  <!-- Final -->
  <div id="final" class="hidden">
    <h1 class="heartbeat">
      I am the most luckiest person in the world to have you 💖
    </h1>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
